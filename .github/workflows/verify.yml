name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run independent verification (verify.py)
        working-directory: code
        run: |
          set -o pipefail
          python3 verify.py | tee /tmp/verify_output.txt
          if ! tail -1 /tmp/verify_output.txt | grep -qE '^ALL [0-9]+ CHECKS PASS\.$'; then
            echo ""
            echo "::error::verify.py did not print ALL CHECKS PASS on its last line. Failing the build."
            exit 1
          fi
          echo "verify.py: ALL CHECKS PASS confirmed."

      - name: Regression-test the generalized template against Home Depot (11 defect checks)
        working-directory: code
        run: |
          set -o pipefail
          python3 template_test_HD.py | tee /tmp/hd_output.txt
          if ! grep -q '^ALL DEFECT-1-THROUGH-9 CHECKS PASS$' /tmp/hd_output.txt; then
            echo ""
            echo "::error::template_test_HD.py did not report ALL DEFECT-1-THROUGH-9 CHECKS PASS. Failing the build."
            exit 1
          fi
          echo "template_test_HD.py: all eleven defect checks confirmed passing."

      - name: Prove the excise tax on O'Reilly Automotive (addendum item 5)
        working-directory: code
        run: |
          set -o pipefail
          python3 excise_test_ORLY.py | tee /tmp/exc_output.txt
          if ! grep -qE '^ALL [0-9]+ EXCISE CHECKS PASS$' /tmp/exc_output.txt; then
            echo ""
            echo "::error::excise_test_ORLY.py did not report ALL EXCISE CHECKS PASS. Failing the build."
            exit 1
          fi
          echo "excise_test_ORLY.py: all excise checks confirmed passing."

      - name: Prove the round trip on American Airlines (addendum item 3)
        working-directory: code
        run: |
          set -o pipefail
          python3 roundtrip_test_AAL.py | tee /tmp/rt_output.txt
          if ! grep -q '^ALL ROUND-TRIP CHECKS PASS$' /tmp/rt_output.txt; then
            echo ""
            echo "::error::roundtrip_test_AAL.py did not report ALL ROUND-TRIP CHECKS PASS. Failing the build."
            exit 1
          fi
          echo "roundtrip_test_AAL.py: all round-trip checks confirmed passing."

      - name: Prove the study is invariant to the cost of equity (2026-08-13)
        working-directory: code
        run: |
          set -o pipefail
          python3 coe_invariance_test.py | tee /tmp/coe_output.txt
          if ! grep -qE '^ALL [0-9]+ COST-OF-EQUITY INVARIANCE CHECKS PASS$' /tmp/coe_output.txt; then
            echo ""
            echo "::error::coe_invariance_test.py did not report ALL CHECKS PASS. Failing the build."
            exit 1
          fi
          echo "coe_invariance_test.py: the rate is an input, not a mechanic. Confirmed."
